<style>
  :host {
    font-family: system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  main {
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    gap: 1.5rem;
    background: #f0f0f2;
    min-height: 100vh;
  }

  .content {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    width: 100%;
    gap: 1.5rem;
    max-width: 1800px;
  }

  .card {
    background: #ffffff;
    border-radius: 0.875rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    border: 1px solid rgba(0,0,0,0.06);
  }

  .card-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    font-size: 0.85rem;
    font-weight: 600;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .card-content { padding: 1rem; }

  .left-section, .right-section {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 200px;
  }

  /* Motor value bar */
  .motor-bar-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .motor-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: #555;
  }
  .motor-bar-track {
    height: 10px;
    background: #e5e5e5;
    border-radius: 5px;
    position: relative;
    overflow: hidden;
  }
  .motor-bar-fill {
    position: absolute;
    top: 0;
    height: 100%;
    border-radius: 5px;
    transition: width 0.05s, left 0.05s;
  }
  .motor-bar-fill.forward {
    left: 50%;
    background: #22c55e;
  }
  .motor-bar-fill.reverse {
    right: 50%;
    background: #ef4444;
  }

  /* Sensor input table */
  .sensor-group { margin-bottom: 0.75rem; }
  .sensor-group-header {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin-bottom: 0.3rem;
  }
  .sensor-item {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    font-family: 'Menlo', 'Consolas', monospace;
    color: #333;
    padding: 2px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .sensor-item .pos { color: #666; }

  router-outlet { display: none; }
</style>

<main class="main">
  <div class="content">

    <!-- ── Left: 2-col grid — zone+status on left, sensor inputs spanning both rows on right ── -->
    <div style="display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; gap:1rem; align-items:start;">

      <div class="card">
        <div class="card-header">Zone Legend</div>
        <div class="card-content">
          <app-zone-legend [currentZone]="currentZone"></app-zone-legend>
        </div>
      </div>

      <!-- Sensor inputs spans both rows -->
      <div class="card" style="grid-row: span 2; min-width:170px;">
        <div class="card-header">Sensor Inputs</div>
        <div class="card-content" style="overflow-y:auto;">
          <div *ngFor="let group of sensorGroups" class="sensor-group">
            <div class="sensor-group-header">{{ group.type }}</div>
            <div *ngFor="let obs of group.items" class="sensor-item">
              <span>{{ obs.name }}</span>
              <span class="pos">
                ({{ obs.x_meters.toFixed(2) }}, {{ obs.y_meters.toFixed(2) }})
              </span>
            </div>
          </div>
          <div *ngIf="sensorGroups.length === 0" style="font-size:0.8rem; color:#aaa;">
            No obstacles
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Rover Status</div>
        <div class="card-content" style="display:flex; flex-direction:column; gap:0.75rem;">
          <app-parameter-display
            [header]="'Position'"
            [parameters]="positionParams"
            [color]="'#6eb9ff'">
          </app-parameter-display>
          <app-parameter-display
            [header]="'Bucket  (B)'"
            [parameters]="bucketParams"
            [color]="'#ff9800'">
          </app-parameter-display>
        </div>
      </div>

    </div>

    <!-- ── Center: Arena Canvas ── -->
    <app-environment
      [roverLeftMotor]="leftMotorValue"
      [roverRightMotor]="rightMotorValue">
    </app-environment>

    <!-- ── Right: Controls + Training Panel ── -->
    <div class="right-section">

      <!-- Training control panel -->
      <app-training-panel></app-training-panel>

      <!-- Motor controls + speed strip -->
      <div class="card" style="min-width: 220px;">
        <div class="card-header">Drive Controls  (WASD)</div>
        <div class="card-content">

          <!-- Vertical sliders side-by-side -->
          <div style="display:flex; gap:1rem; justify-content:center; margin-bottom:1rem;">
            <app-universal-slider
              [(value)]="leftMotorValue"
              [min]="-1" [max]="1" [step]="0.01"
              [environmentHeightPx]="environment?.environment_height_px"
              orientation="vertical"
              label="Left"
              [showValue]="true"
              color="#0ea5e9">
            </app-universal-slider>
            <app-universal-slider
              [(value)]="rightMotorValue"
              [min]="-1" [max]="1" [step]="0.01"
              [environmentHeightPx]="environment?.environment_height_px"
              orientation="vertical"
              label="Right"
              [showValue]="true"
              color="#8b5cf6">
            </app-universal-slider>
          </div>

          <!-- Actual motor value bars -->
          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            <div class="motor-bar-wrap">
              <div class="motor-bar-label">
                <span>L actual</span>
                <span>{{ leftMotorActual.toFixed(2) }}</span>
              </div>
              <div class="motor-bar-track">
                <div class="motor-bar-fill"
                     [class.forward]="motorBarForward(leftMotorActual)"
                     [class.reverse]="!motorBarForward(leftMotorActual)"
                     [style.width.%]="motorBarWidth(leftMotorActual)">
                </div>
              </div>
            </div>
            <div class="motor-bar-wrap">
              <div class="motor-bar-label">
                <span>R actual</span>
                <span>{{ rightMotorActual.toFixed(2) }}</span>
              </div>
              <div class="motor-bar-track">
                <div class="motor-bar-fill"
                     [class.forward]="motorBarForward(rightMotorActual)"
                     [class.reverse]="!motorBarForward(rightMotorActual)"
                     [style.width.%]="motorBarWidth(rightMotorActual)">
                </div>
              </div>
            </div>
          </div>

          <!-- Speed strip -->
          <div style="margin-top:0.75rem; padding-top:0.6rem; border-top:1px solid rgba(0,0,0,0.06); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:0.5rem;">
            <span style="font-size:0.72rem; color:#888;">Speed</span>
            <app-universal-slider
              [(value)]="speedMultiplierPercent"
              [min]="0" [max]="500" [step]="1"
              orientation="horizontal"
              label=""
              [showValue]="false"
              [thumbSize]="14"
              [trackSize]="4"
              color="#10b981">
            </app-universal-slider>
            <span style="font-size:0.72rem; font-family:monospace; color:#444; min-width:2.8rem; text-align:right;">{{ speedMultiplierPercent }}%</span>
          </div>

        </div>
      </div>

    </div>
  </div>
</main>
